name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  presubmit:
    name: Presubmit (format + host tests + firmware link)
    runs-on: [self-hosted]
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Presubmit
        run: nix develop --command internal/presubmit/presubmit.sh

  manual-build:
    name: Manual-target link check (hardware test binaries)
    runs-on: [self-hosted]
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Build APU hardware-test firmware
        run: |
          nix develop --command bazel build \
            //applications/apu/blink:blink \
            //applications/apu/hello_world:hello_world \
            //applications/apu/eth_loopback:eth_loopback

      - name: Build RPU hardware-test firmware
        run: |
          nix develop --command bazel build \
            //applications/rpu/hello_world:hello_world

      - name: Build zub_ctl host binary
        run: nix develop --command bazel build --config=host //tooling/zub_ctl:zub_ctl
