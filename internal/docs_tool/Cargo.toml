[package]
name = "pdf_to_markdown"
version = "0.1.0"
edition = "2021"
publish = false
description = "Bazel-built PDF-to-Markdown converter for zub_1cg documentation."

[[bin]]
name = "pdf_to_markdown"
path = "src/main.rs"

[dependencies]
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
