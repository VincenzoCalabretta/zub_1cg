# add_apb_target.cfg — source AFTER aes_zub.cfg to add APB mem_ap on AP[1].
# AP[1] IDR = 0x44770002 (APB-AP, confirmed by scan_aps.tcl).
# Used to read APB-mapped debug registers (Cortex-R5 DBGDIDR etc.)
# without adding a cortex_r4 target (which probes debug registers during init).
target create uscale.apb mem_ap -dap uscale.dap -ap-num 1
