# OpenOCD board configuration — AES-ZUB (Zynq UltraScale+ MPSoC)
#
# Interface: FTDI FT2232H, Manufacturer="Xilinx", Product="JTAG+Serial"
#            VID:PID 0403:6010, channel 0 = JTAG, channel 1 = UART
#
# This config defines ONLY the AXI mem_ap target (no A53 targets).
# In JTAG boot mode the A53 CoreSight debug power domain is never ungated,
# so any A53 target examination sets JTAG-DP STICKY ERROR and blocks the
# AXI mem_ap from being usable on subsequent runs (error persists across
# reconnects until power cycle).  Omitting A53 targets entirely avoids this.
#
# The PS tap setup event reproduces the DAP-enable sequence from
# target/xilinx_zynqmp.cfg without bringing in the A53 target definitions.
#
# Prerequisites:
#   - ftdi_sio unbound from interface 0 (udev rule in scripts/60-openocd.rules)
#   - Board in JTAG boot mode (all DIP switches OFF = BOOT_MODE=0000)
#   - Power-cycle board after switching boot mode
#
# Usage:
#   openocd -f scripts/openocd/aes_zub.cfg -f scripts/openocd/load_r5.tcl

# ── FTDI FT2232H interface ────────────────────────────────────────────────────
adapter driver ftdi
ftdi vid_pid 0x0403 0x6010
ftdi device_desc "JTAG+Serial"
ftdi channel 0

# Standard FTDI JTAG pin mapping on ADBUS (channel 0):
#   D0 = TCK (out)   D1 = TDI (out)
#   D2 = TDO (in)    D3 = TMS (out)
# Init: TMS=1 (JTAG idle), all others 0
# Direction: D0/D1/D3 output, D2 input
ftdi layout_init 0x0008 0x000b

adapter speed 3000
ftdi tdo_sample_edge falling

# No hard SRST/TRST lines wired — rely on JTAG-only control
reset_config none

# ── JTAG chain ────────────────────────────────────────────────────────────────
# The ZynqMP JTAG chain has two taps:
#   1. uscale.tap — ARM CoreSight DAP (ID 0x5ba00477)
#   2. uscale.ps  — Zynq MPSoC PS tap (ID 0x04688093 for XCZU1CG or similar)
#
# The PS tap ID 0x04688093 (part 0x4688, mfg 0x049 = Xilinx) is not in the
# default list in xilinx_zynqmp.cfg; specifying it directly avoids the
# ignore-version fallback and makes the TAP match reliable.
jtag newtap uscale tap -irlen 4 -ircapture 0x1 -irmask 0xf -expected-id 0x5ba00477
jtag newtap uscale ps  -irlen 12 -ircapture 0x1 -irmask 0x03 -expected-id 0x04688093

# ── PS tap setup: enable the DAP tap in the JTAG chain ───────────────────────
# The DAP tap is gated behind the PS tap by a Xilinx-specific JTAG command.
# Sequence taken from target/xilinx_zynqmp.cfg (© OpenOCD project, GPL-2.0+):
#   irscan PS 0x824  + drscan PS 32 0x00000003  → enables DAP
#   jtag arp_init                               → re-scans chain with DAP live
set jtag_configured 0
jtag configure uscale.ps -event setup {
    global jtag_configured
    if { $jtag_configured == 0 } {
        irscan uscale.ps 0x824
        drscan uscale.ps 32 0x00000003
        runtest 100
        set jtag_configured 1

        # Clear any stale STICKYERR in the DP before re-examining the chain.
        # STICKYERR persists across JTAG reconnects (set by WAIT/timeout on AXI).
        # Two clearing mechanisms used for redundancy:
        #
        # 1) DP ABORT register (IR=0x8, 35-bit DR):
        #    DR = (ABORT_VALUE << 3) | (A[3:2]<<1) | RnW
        #    ABORT_VALUE = 0x1F (DAPABORT|STKCMPCLR|STKERRCLR|WDERRCLR|ORUNERRCLR)
        #    35-bit: 0x1F<<3 = 0xF8
        irscan uscale.tap 0x8
        drscan uscale.tap 35 0xF8
        runtest 100

        # 2) DPACC write to CTRL/STAT with SSTICKYERR=1 (write-1-to-clear):
        #    OpenOCD dap_dp_init does NOT write SSTICKYERR, so we do it here.
        #    CTRL/STAT addr: A[3:2]=01.
        #    DATA = CSYSPWRUPREQ(bit30)|CDBGPWRUPREQ(bit28)|STICKYERR(bit5)
        #         = 0x50000020
        #    35-bit DR = (DATA<<3)|(A[2]<<1)|RnW = 0x280000102
        #    Then flush pipeline with RDBUFF read: A[3:2]=11, RnW=1 → 0x07
        irscan uscale.tap 0xA
        drscan uscale.tap 35 0x280000102
        drscan uscale.tap 35 0x07
        runtest 200

        jtag arp_init
    }
}

# ── ARM CoreSight DAP ─────────────────────────────────────────────────────────
dap create uscale.dap -chain-position uscale.tap

# ── AXI mem_ap (AP 0) ────────────────────────────────────────────────────────
# Provides direct read/write to the full AXI memory map:
#   RPU control registers  0xFF9A0000, 0xFF9A0100
#   CRL_APB reset register 0xFF5E023C
#   R5-0 ATCM (AXI)       0xFFE00000  (= R5-local 0x00000000)
target create uscale.axi mem_ap -dap uscale.dap -ap-num 0

# R5-0 CoreSight debug via APB-AP (AP 1, confirmed by scan_aps.tcl).
# APB-AP IDR = 0x44770002; R5-0 debug base = 0xFE810000 in APB space.
# -defer-examine: do not examine at init — examine explicitly in load scripts
# so we can control timing relative to RPU reset state.
target create uscale.r5_0 cortex_r4 -dap uscale.dap -ap-num 1 -dbgbase 0xFE810000 -defer-examine
